# Open SWE review is temporarily paused (MOB-1461).
# Restore its requirement by uncommenting the check-success condition below.
merge_queue:
  mode: serial
  max_parallel_checks: 1

merge_protections_settings:
  reporting_method: check-runs
  post_comment: false

merge_protections:
  - name: Open SWE review policy
    if:
      - repository-name != mergify-config
    success_conditions:
      - -draft
      - check-success = @openswebot/Open SWE Review
